name: Demo offline safety tests
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pyyaml
      - run: python -m unittest discover -s tests -v
      - name: Desktop mock verification smoke tests
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          xvfb-run -a python -m unittest discover -s tests -p test_gui_desktop.py -v
      - run: python -m compileall -q src/surface_printing src/syringe_controller src/ur5e_toolheads src/surface_printing_gui
      - run: g++ -std=c++17 -I tests/firmware_stub tests/test_firmware.cpp -o /tmp/test_syringe_firmware
      - run: /tmp/test_syringe_firmware
