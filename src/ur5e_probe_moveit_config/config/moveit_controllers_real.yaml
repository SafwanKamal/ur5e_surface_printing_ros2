# MoveIt controller configuration for the physical UR5e.
#
# ur_robot_driver creates and manages this controller.
# MoveIt only sends FollowJointTrajectory goals to it.

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_manage_controllers: false

moveit_simple_controller_manager:
  controller_names:
    - scaled_joint_trajectory_controller

  scaled_joint_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint